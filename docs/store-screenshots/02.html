<meta charset="utf-8">

<style>

<div class="page">

  <div class="block">
    <div class="label strong">ローマ字を打ち間違えていても直す</div>
    <div class="pair">
      <div class="box"><span class="mono">sonotuskiwomita</span></div>
      <svg class="arrow-h" width="76" height="34" viewBox="0 0 76 34" fill="none">
        <rect x="0" y="12" width="52" height="10" fill="#DF8D3B"/>
        <path d="M74 17 L48 2 L48 32 Z" fill="#DF8D3B"/>

      <div class="box result"><span class="jp">その月を見た</span></div>

    <div class="caption">tsuki の打ち間違いを検出して修復</div>

  <div class="block">

    <div class="pair">
      <div class="box"><span class="jp" style="color:#8A8A8A">ぎtこっみt</span></div>
      <svg class="arrow-h" width="76" height="34" viewBox="0 0 76 34" fill="none">
        <rect x="0" y="12" width="52" height="10" fill="#DF8D3B"/>
        <path d="M74 17 L48 2 L48 32 Z" fill="#DF8D3B"/>
